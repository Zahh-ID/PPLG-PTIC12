name: logicworld
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: logicworld
      POSTGRES_DB: logicworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure-db.js first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
volumes:
  postgres_data:
