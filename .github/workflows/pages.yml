name: GitHub Pages (manual)

# No push/PR trigger. Nothing publishes until explicitly dispatched with publish=true.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Pages after all tests pass'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - name: Install browser and Linux dependencies
        run: npx puppeteer browsers install chrome --install-deps
      - run: npm run test:browser
      - name: Save downloadable build (does not publish)
        uses: actions/upload-artifact@v4
        with:
          name: circuit-rescue-web
          path: dist/
          retention-days: 7
      - name: Package Pages artifact
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-test-reports
          path: .local/reports/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish tested game
        id: deployment
        uses: actions/deploy-pages@v4
