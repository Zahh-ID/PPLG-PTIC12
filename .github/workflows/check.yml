name: Game checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - name: Use runner Chrome
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm run test:mobile-browser
        timeout-minutes: 5
      - run: npm run test:journey
        timeout-minutes: 5
      - run: npm run test:mobile
        timeout-minutes: 5
      - run: npm run test:modals
        timeout-minutes: 5
      - run: npm run test:readability
        timeout-minutes: 5
      - run: npm run test:combat-browser
        timeout-minutes: 7
      - run: npm run test:highlights
        timeout-minutes: 5
      - run: npm run test:world
        timeout-minutes: 5
      - run: npm run test:ports
        timeout-minutes: 5
      - run: npm run test:gameplay
        timeout-minutes: 5
      - run: npm run test:routes
        timeout-minutes: 12
      - run: npm run test:browser
        timeout-minutes: 12
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-test-reports
          path: .local/reports/
          if-no-files-found: ignore
          retention-days: 7
